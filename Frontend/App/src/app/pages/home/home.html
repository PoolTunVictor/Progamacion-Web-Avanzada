<section class="home-page">
  <section class="hero-carousel">
    <div
      class="hero-slide"
      [style.background-image]="'linear-gradient(rgba(0,0,0,.20), rgba(0,0,0,.15)), url(' + slides[currentSlide].image + ')'"
    >
      <div class="hero-content">
        <p class="hero-kicker">Plaza Altabrisa Mérida</p>
        <h1>{{ slides[currentSlide].title }}</h1>
        <p class="hero-text">{{ slides[currentSlide].subtitle }}</p>
      </div>

      <div class="hero-dots">
        <button
          *ngFor="let slide of slides; let i = index"
          class="dot"
          [class.active]="currentSlide === i"
          (click)="goToSlide(i)"
          type="button"
          [attr.aria-label]="'Ir al slide ' + (i + 1)"
        ></button>
      </div>
    </div>
  </section>

  <section class="promotions">
    <div class="section-header">
      <h2>Promociones y Anuncios</h2>
      <a routerLink="/eventos" class="see-more">Ver más</a>
    </div>

    <div class="promo-grid">
      <article class="promo-card" *ngFor="let promo of visiblePromotions">
        <img [src]="promo.image" [alt]="promo.title" />
        <div class="promo-info">
          <h3>{{ promo.title }}</h3>
          <p>{{ promo.description }}</p>
        </div>
      </article>
    </div>
  </section>
</section>
