<section class="directory-page">
  <div class="directory-overlay">
    <div class="directory-container">
      <h1 class="page-title">Directorio</h1>

      <div class="top-filters">
        <div class="search-box">
          <input
            type="text"
            [(ngModel)]="searchTerm"
            placeholder="Buscar una tienda..."
          />
        </div>
      </div>

      <div class="content-layout">
        <aside class="sidebar">
          <div class="sidebar-header">
            <span>{{ selectedCategory }}</span>
          </div>

          <ul class="category-list">
            <li
              *ngFor="let category of categories"
              [class.selected]="selectedCategory === category.name"
              (click)="selectCategory(category.name)"
            >
              <span>{{ category.name }}</span>
            </li>
          </ul>
        </aside>

        <section class="stores-section">
          <div class="stores-grid">
            <div
              class="store-card"
              *ngFor="let store of filteredStores"
              (click)="openStoreModal(store)"
            >
              <div class="store-logo" [ngClass]="store.logoClass">
                {{ store.logoText }}
              </div>
            </div>
          </div>

          <div class="bottom-info">
            <div class="contact-button-wrapper">
              <button class="contact-button">CONTÁCTANOS</button>
            </div>
          </div>
        </section>
      </div>
    </div>
  </div>

  <div
    class="modal-backdrop"
    *ngIf="selectedStore"
    (click)="closeStoreModal()"
  >
    <div class="store-modal" (click)="$event.stopPropagation()">
      <button class="modal-close" type="button" (click)="closeStoreModal()">
        ✕
      </button>

      <div class="modal-image">
        <img [src]="selectedStore.image" [alt]="selectedStore.name" />
      </div>

      <div class="modal-content">
        <h2>{{ selectedStore.name }}</h2>
        <p class="modal-category">{{ selectedStore.category }}</p>
        <p>{{ selectedStore.description }}</p>
      </div>
    </div>
  </div>
</section>
