<div class="background-container">
  <div class="contact-card">
    
    <div class="header-contacto">
      <div class="contacto-logo-box">
        <img 
          src="assets/mensaje.png" 
          alt="Logo Mensaje" 
          class="contacto-logo-img"
        >
      </div>

      <div>
        <h1>Contáctanos</h1>
        <p>Déjanos tus datos y nos pondremos en contacto contigo.</p>
      </div>
    </div>

    <div class="content-grid">
      <div class="form-side">
        <select class="gold-select">
          <option>Selecciona una opción</option>
          <option>Quejas y Sugerencias</option>
          <option>Espacios Disponibles</option>
        </select>

        <div class="input-group">
          <span class="icon">👤</span>
          <input type="text" placeholder="Nombre">
        </div>

        <div class="input-group">
          <span class="icon">🖂</span>
          <input type="email" placeholder="Email">
        </div>

        <div class="input-group">
          <span class="icon">🕻</span>
          <input type="text" placeholder="Teléfono">
        </div>

        <div class="input-group textarea-group">
          <span class="icon">✎</span>
          <textarea placeholder="Mensaje..."></textarea>
        </div>

        <button class="btn-enviar-gold">Enviar</button>
      </div>

      <div class="map-side">
        

        <iframe
          src="https://www.google.com/maps?q=Plaza%20Altabrisa%20M%C3%A9rida&output=embed"
          width="100%"
          height="100%"
          style="border:0;"
          allowfullscreen=""
          loading="lazy">
        </iframe>
      </div>
    </div>

  </div>
</div>
