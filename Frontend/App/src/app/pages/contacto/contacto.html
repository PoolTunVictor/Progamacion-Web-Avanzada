<div class="background-container">
  <div class="contact-card">
    
    <div class="header-contacto">
      <img 
    src="/assets/mensaje.png" 
    alt="Logo Mensaje" 
    class="contacto-logo-img">
      <h1>Contáctanos</h1>
    </div>

    <div class="content-grid">
      <div class="form-side">
        <select class="gold-select">
          <option>Selecciona una opción</option>
          <option>Quejas y Sugerencias</option>
          <option>Espacios Disponibles</option>
        </select>

        <div class="input-group">
          <span class="icon">👤</span>
          <input type="text" placeholder="Nombre">
        </div>

        <div class="input-group">
          <span class="icon">🖂</span>
          <input type="email" placeholder="Email">
        </div>

        <div class="input-group">
          <span class="icon">🕻</span>
          <input type="text" placeholder="Teléfono">
        </div>

        <div class="input-group textarea-group">
          <span class="icon">✎</span>
          <textarea placeholder="Mensaje..."></textarea>
        </div>

        <button class="btn-enviar-gold">Enviar</button>
      </div>

      <div class="map-side">
        <iframe 
          src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3723.9234973356893!2d-89.5857321!3d21.0357471!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x8f5676906236967b%3A0x6b45e990c0062f85!2sPlaza%20Altabrisa%20M%C3%A9rida!5e0!3m2!1ses-419!2smx!4v1712690000000!5m2!1ses-419!2smx" 
          width="100%" height="100%" style="border:0;" allowfullscreen="" loading="lazy">
        </iframe>
      </div>
    </div>

  </div>
</div>
