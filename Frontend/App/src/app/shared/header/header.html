<header class="site-header">
  <div class="header-container">
    <a routerLink="/" class="logo">
      <img src="assets/carso.jpg" alt="Inmuebles Cars" />
    </a>

    <nav class="main-nav">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Inicio</a>
      <a routerLink="/directorio" routerLinkActive="active">Directorio</a>
      <a routerLink="/mapa" routerLinkActive="active">Mapa</a>
      <a routerLink="/eventos" routerLinkActive="active">Eventos</a>
      <a routerLink="/contacto" routerLinkActive="active">Contacto</a>
    </nav>

    <div class="header-actions">

      <button class="user-btn" aria-label="Perfil">
        <span>◉</span>
      </button>
    </div>
  </div>
</header>
